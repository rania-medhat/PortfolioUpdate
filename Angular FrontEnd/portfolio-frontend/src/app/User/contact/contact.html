<section class="p-5">
<div class="p-5">
          <h2 class="section-title text-center">Contact Me</h2>
          <p class="section-title text-center">Get in Touch</p>

<form class="p-5" #ContactForm="ngForm" (ngSubmit)="addMessage(ContactForm)">

  <div class="mb-3">
    <input
      type="text"
      class="form-control"
      name="name"
      ngModel
      required
      placeholder="User Name">
  </div>

  <div class="mb-3">
    <input
      type="email"
      class="form-control"
      name="email"
      ngModel
      required
      placeholder="Email">
  </div>

  <div class="mb-3">
    <input
      type="number"
      class="form-control"
      name="phone"
      ngModel
      required
      placeholder="Phone">
  </div>
  <div class="mb-3">
    <textarea
      type="text"
      class="form-control"
      name="message"
      ngModel
      required
      placeholder="Message">
    </textarea>
  </div>

  <button class="btn btn-dark" [disabled]="ContactForm.invalid">
    Add Message
  </button>

</form>
</div>

</section>
